[workspace]
members = [
    "crates/camerashot-core",
    "crates/camerashot-platform",
    "crates/camerashot-overlay",
    "crates/camerashot-media",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ariadnev Eco <contact@ariadnev.eco>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
parking_lot = "0.12"
tiny-skia = "0.11"


